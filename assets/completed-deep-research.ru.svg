<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="240" viewBox="0 0 1200 240" role="img" aria-labelledby="title desc"><title id="title">Глубокие исследования: готовые профили компаний</title><desc id="desc">Пять компаний и два организатора или оператора. Источники, услуги и гипотезы сотрудничества.</desc><defs><linearGradient id="bg"><stop stop-color="#101b32"/><stop offset="1" stop-color="#29304e"/></linearGradient></defs><rect width="1200" height="240" rx="20" fill="url(#bg)"/><rect x="1040" y="53" width="94" height="125" rx="12" fill="none" stroke="#bba3ff" stroke-width="3"/><path d="M1060 85h54m-54 22h54m-54 22h37" stroke="#bba3ff" stroke-width="4"/><text x="48" y="46" fill="#c6b6ff" font-size="15" font-family="Arial,sans-serif" letter-spacing="3">PUBLIC-SOURCE RESEARCH · EN / RU</text><text x="48" y="103" fill="#fff" font-size="34" font-weight="700" font-family="Arial,sans-serif">Глубокие исследования компаний</text><text x="48" y="148" fill="#e1e0ee" font-size="22" font-family="Arial,sans-serif">5 компаний + 2 организатора / оператора</text><text x="48" y="199" fill="#c6b6ff" font-size="17" font-family="Arial,sans-serif">Источники · Услуги · Возможности сотрудничества →</text></svg>
